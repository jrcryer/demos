name: Deploy lambda-durable-functions-order-workflow

on:
  push:
    branches: [main]
    paths:
      - 'lambda-durable-functions-order-workflow/**'
      - '.github/workflows/deploy-demo.yml'
      - '.github/workflows/deploy-lambda-durable-functions-order-workflow.yml'
  workflow_dispatch:

concurrency:
  group: deploy-lambda-durable-functions-order-workflow-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-demo.yml
    with:
      demo-dir: lambda-durable-functions-order-workflow
