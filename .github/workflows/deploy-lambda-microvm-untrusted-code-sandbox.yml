name: Deploy lambda-microvm-untrusted-code-sandbox

on:
  push:
    branches: [main]
    paths:
      - 'lambda-microvm-untrusted-code-sandbox/**'
      - '.github/workflows/deploy-demo.yml'
      - '.github/workflows/deploy-lambda-microvm-untrusted-code-sandbox.yml'
  workflow_dispatch:

concurrency:
  group: deploy-lambda-microvm-untrusted-code-sandbox-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-demo.yml
    with:
      demo-dir: lambda-microvm-untrusted-code-sandbox
