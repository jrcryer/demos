name: Deploy step-functions-ticket-router

on:
  push:
    branches: [main]
    paths:
      - 'step-functions-ticket-router/**'
      - '.github/workflows/deploy-demo.yml'
      - '.github/workflows/deploy-step-functions-ticket-router.yml'
  workflow_dispatch:

concurrency:
  group: deploy-step-functions-ticket-router-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-demo.yml
    with:
      demo-dir: step-functions-ticket-router
