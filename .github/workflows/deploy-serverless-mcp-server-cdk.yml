name: Deploy serverless-mcp-server-cdk

on:
  push:
    branches: [main]
    paths:
      - 'serverless-mcp-server-cdk/**'
      - '.github/workflows/deploy-demo.yml'
      - '.github/workflows/deploy-serverless-mcp-server-cdk.yml'
  workflow_dispatch:

concurrency:
  group: deploy-serverless-mcp-server-cdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-demo.yml
    with:
      demo-dir: serverless-mcp-server-cdk
